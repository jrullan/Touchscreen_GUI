name: Safety regression tests
on: [push, pull_request]
jobs:
  host-sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Strict return checks
        run: python3 tests/host/check_returns.py
      - name: Exact-library clean-build command regression
        run: python3 tests/tools/test_check_arduino.py
      - name: Portable icon declarations and flash-storage regression tests
        run: python3 tests/tools/test_icons.py
      - name: Address, undefined behavior and leak regression tests
        run: python3 tests/host/run.py
      - name: Actual bundled XPT2046 lifecycle, mapping and cache regressions
        run: python3 tests/xpt2046/run.py
      - name: Fetch pinned real Adafruit GFX rasterizer
        uses: actions/checkout@v4
        with:
          repository: adafruit/Adafruit-GFX-Library
          ref: 85ce269b270eb1241e36a22cceec2c5e0905f48c
          path: .test-deps/Adafruit-GFX-Library
      - name: Real glyph cleanup regression tests
        env:
          ADAFRUIT_GFX_DIR: ${{ github.workspace }}/.test-deps/Adafruit-GFX-Library
        run: python3 tests/rasterized/run.py
      - name: Nested SPI transaction dispatch regression tests
        env:
          ADAFRUIT_GFX_DIR: ${{ github.workspace }}/.test-deps/Adafruit-GFX-Library
        run: python3 tests/transactions/run.py
      - name: Real glyph and transaction widget regression tests
        env:
          ADAFRUIT_GFX_DIR: ${{ github.workspace }}/.test-deps/Adafruit-GFX-Library
        run: python3 tests/rasterized/run_widgets.py
      - name: Keyboard glyph bounds, restoration and shared-font regressions
        env:
          ADAFRUIT_GFX_DIR: ${{ github.workspace }}/.test-deps/Adafruit-GFX-Library
        run: python3 tests/rasterized/run_keyboard.py
      - name: Chart X-axis spacing, glyph bounds and shared-font regressions
        env:
          ADAFRUIT_GFX_DIR: ${{ github.workspace }}/.test-deps/Adafruit-GFX-Library
        run: python3 tests/rasterized/run_xaxis.py
      - name: Icon bitmap pixels, clipping, rotations and run batching
        env:
          ADAFRUIT_GFX_DIR: ${{ github.workspace }}/.test-deps/Adafruit-GFX-Library
        run: python3 tests/rasterized/run_icon_runs.py
      - name: Optional raster runner environment regression
        run: python3 tests/tools/test_optional_raster_runner.py
      - name: Opt-out text storage preserves keyboard and icon pixels
        env:
          ADAFRUIT_GFX_DIR: ${{ github.workspace }}/.test-deps/Adafruit-GFX-Library
        run: python3 tests/host/run_optional_raster.py
      - name: MultiTrend exact-capacity pixel equivalence
        env:
          ADAFRUIT_GFX_DIR: ${{ github.workspace }}/.test-deps/Adafruit-GFX-Library
        run: python3 tests/rasterized/run_multitrend_capacity.py
